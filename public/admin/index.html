<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后台 · 写作与管理</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230F1412'/%3E%3Cpath d='M5 16h3l2-6 3 12 3-9 2 5 2-3h7' stroke='%23DFA463' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
:root{--ink:#0F1412;--panel:#151B18;--panel2:#1B2320;--paper:#E9E6DC;--muted:#9AA69F;--amber:#DFA463;--line:rgba(233,230,220,.13);
--serif:"Noto Serif SC",Songti SC,serif;--sans:"Noto Sans SC",PingFang SC,Microsoft YaHei,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--amber);text-decoration:none}
input,textarea,select,button{font-family:inherit;font-size:14px;color:var(--paper)}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* 登录 */
#login{max-width:380px;margin:14vh auto 0;padding:0 24px}
#login h1{font-family:var(--serif);font-weight:600;font-size:26px;margin-bottom:8px}
#login p{color:var(--muted);font-size:13.5px;margin-bottom:26px}
.field{margin-bottom:16px}
label{display:block;font-size:12.5px;color:var(--muted);letter-spacing:.08em;margin-bottom:7px}
input[type=text],input[type=password],textarea,select{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;outline:none;
  transition:border-color .18s;
}
input:focus,textarea:focus,select:focus{border-color:rgba(223,164,99,.55)}
textarea{resize:vertical;line-height:1.8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:4px;
  border:1px solid var(--line);background:var(--panel2);cursor:pointer;transition:.18s;font-size:14px}
.btn:hover{border-color:rgba(223,164,99,.5);color:var(--paper)}
.btn.primary{background:var(--amber);color:#1a1208;border-color:var(--amber);font-weight:500}
.btn.primary:hover{background:#e8b478;color:#1a1208}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:#c9655c;color:#e3928a}
.msg{font-size:13px;margin-top:14px;min-height:20px}
.msg.err{color:#e3928a}
.msg.ok{color:#9ec6a6}

/* 主体 */
.top{position:sticky;top:0;z-index:20;background:rgba(15,20,18,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
.topbar .l{display:flex;align-items:center;gap:14px}
.topbar h1{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:.04em}
.tabs{display:flex;gap:6px}
.tabs button{background:transparent;border:1px solid transparent;border-radius:4px;padding:6px 12px;color:var(--muted);cursor:pointer;font-size:13.5px;transition:.16s}
.tabs button:hover{color:var(--paper)}
.tabs button.on{color:var(--paper);border-color:var(--line);background:var(--panel2)}
.main{padding:32px 0 90px}

/* 列表 */
.plist{width:100%;border-collapse:collapse}
.plist th{font-size:12.5px;color:var(--muted);text-align:left;font-weight:400;letter-spacing:.08em;padding:0 10px 12px;border-bottom:1px solid var(--line)}
.plist td{padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
.plist td.t{font-family:var(--serif);font-size:16px}
.plist .st{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.plist .st.draft{color:#c8a06a}
.plist .acts{text-align:right;white-space:nowrap}
.plist .acts a,.plist .acts button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px}
.plist .acts a:hover,.plist .acts button:hover{color:var(--amber)}
.empty{color:var(--muted);font-size:14px;padding:40px 0;text-align:center}

/* 编辑器 */
.grid{display:grid;grid-template-columns:1fr 320px;gap:26px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px}
.card h2{font-family:var(--serif);font-weight:600;font-size:17px;margin-bottom:16px}
.editor textarea{min-height:420px;font-family:ui-monospace,Consolas,"PingFang SC",monospace;font-size:14.5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.9;margin-top:12px}
.hint code{background:var(--panel2);padding:1px 5px;border-radius:3px;font-size:12px}
.pv{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:18px;max-height:520px;overflow:auto;font-size:15px}
.pv h2{font-family:var(--serif);font-size:19px;margin:1.4em 0 .6em}
.pv p{margin-bottom:1em;color:#DDD9CE}
.pv blockquote{border-left:2px solid rgba(223,164,99,.4);padding-left:16px;color:var(--amber);margin:1.2em 0}
.pv ul{padding-left:1.2em;margin:1em 0}
.pv img{max-width:100%;border-radius:3px}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.saved{font-size:12.5px;color:var(--muted)}
@media (max-width:900px){.grid{grid-template-columns:1fr}.editor textarea{min-height:340px}}
@media (max-width:680px){.wrap{padding:0 16px}.plist td.t{font-size:15px}.plist th:nth-child(3),.plist td:nth-child(3){display:none}}
</style>
</head>
<body>

<!-- ========== 登录 ========== -->
<div id="login" hidden>
  <h1>进入后台</h1>
  <p>输入站长的密码即可开始写作。密码在部署时的环境变量 <span style="color:var(--paper)">ADMIN_PASSWORD</span> 里设置。</p>
  <div class="field">
    <label>密码</label>
    <input type="password" id="pw" autocomplete="current-password" placeholder="••••••••">
  </div>
  <button class="btn primary" id="doLogin" style="width:100%">登录</button>
  <div class="msg" id="loginMsg"></div>
  <p style="margin-top:30px"><a href="/">&larr; 回到博客首页</a></p>
</div>

<!-- ========== 主体 ========== -->
<div id="app" hidden>
  <div class="top">
    <div class="wrap topbar">
      <div class="l">
        <h1>写作台</h1>
        <div class="tabs">
          <button data-tab="list" class="on">文章</button>
          <button data-tab="edit">写文章</button>
          <button data-tab="set">站点设置</button>
        </div>
      </div>
      <div class="l">
        <a href="/" target="_blank" style="font-size:13px;color:var(--muted)">查看站点</a>
        <button class="btn ghost" id="doLogout" style="padding:6px 12px;font-size:13px">退出</button>
      </div>
    </div>
  </div>

  <div class="main wrap">
    <!-- 列表 -->
    <section id="paneList">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
        <p style="font-size:13px;color:var(--muted)" id="listInfo">—</p>
        <button class="btn primary" id="newPost">写新文章</button>
      </div>
      <div id="listBox"></div>
    </section>

    <!-- 编辑器 -->
    <section id="paneEdit" hidden>
      <div class="grid">
        <div class="card editor">
          <div class="field">
            <label>标题</label>
            <input type="text" id="fTitle" maxlength="200" placeholder="比如：开了三年 XT5，我把这套 AKG 调成了现在这样">
          </div>
          <div class="field">
            <label>摘要（列表里的一句话，可留空）</label>
            <input type="text" id="fDek" maxlength="300" placeholder="一段十三段均衡器的调整记录">
          </div>
          <div style="display:grid;grid-template-columns:1fr 150px;gap:16px">
            <div class="field">
              <label>分类</label>
              <input type="text" id="fCat" maxlength="30" placeholder="车里 / 歌单 / 随笔">
            </div>
            <div class="field">
              <label>状态</label>
              <select id="fStatus">
                <option value="published">已发布</option>
                <option value="draft">草稿</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label>正文</label>
            <div class="toolbar">
              <button class="btn ghost" data-em="## " style="padding:5px 10px;font-size:12.5px">小标题</button>
              <button class="btn ghost" data-em="> " style="padding:5px 10px;font-size:12.5px">引用</button>
              <button class="btn ghost" data-em="- " style="padding:5px 10px;font-size:12.5px">列表</button>
              <button class="btn ghost" id="btnImg" style="padding:5px 10px;font-size:12.5px">插入图片</button>
              <button class="btn ghost" id="btnPv" style="padding:5px 10px;font-size:12.5px">预览</button>
              <input type="file" id="imgFile" accept="image/*" hidden>
            </div>
            <textarea id="fBody" placeholder="直接写就行，空一行就是新段落。"></textarea>
            <div class="hint">
              排版规则：空行分段 · <code>## 标题</code> · <code>&gt; 引用</code> · <code>- 列表</code> · <code>**加粗**</code>，换行不用管。
            </div>
          </div>
          <div class="rowbtns">
            <button class="btn primary" id="btnSave">保存并发布</button>
            <button class="btn ghost" id="btnCancel">取消</button>
            <span class="msg" id="editMsg"></span>
          </div>
        </div>
        <div>
          <div class="card" id="pvCard" hidden>
            <h2>预览</h2>
            <div class="pv" id="pvBox"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 设置 -->
    <section id="paneSet" hidden>
      <div class="card" style="max-width:620px">
        <h2>站点设置</h2>
        <div class="field"><label>站名</label><input type="text" id="sName" maxlength="40"></div>
        <div class="field"><label>副标题 / 一句话介绍</label><textarea id="sTag" rows="3" maxlength="400"></textarea></div>
        <div class="field"><label>关于页内容</label><textarea id="sAbout" rows="8" maxlength="4000"></textarea></div>
        <div class="field"><label>页脚左侧文字（可留空）</label><input type="text" id="sFoot" maxlength="60"></div>
        <div class="field"><label>修改后台密码（不改就留空）</label><input type="password" id="sPass" autocomplete="new-password" maxlength="100"></div>
        <div class="rowbtns">
          <button class="btn primary" id="btnSet">保存设置</button>
          <span class="msg" id="setMsg"></span>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
var ME = { authed:false };
var CURRENT = null; // 正在编辑的文章 id
var ALL = [];

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function inline(s){
  var t = esc(s);
  t = t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  t = t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1" loading="lazy">');
  return t;
}
function mdLite(src){
  var lines=String(src||"").replace(/\r/g,"").split("\n"),out=[],para=[],list=[];
  function fp(){if(para.length){out.push("<p>"+inline(para.join(" "))+"</p>");para=[];}}
  function fl(){if(list.length){out.push("<ul>"+list.map(function(x){return "<li>"+inline(x)+"</li>";}).join("")+"</ul>");list=[];}}
  for(var i=0;i<lines.length;i++){
    var ln=lines[i];
    if(/^##\s+/.test(ln)){fp();fl();out.push("<h2>"+inline(ln.replace(/^##\s+/,""))+"</h2>");continue;}
    if(/^>\s+/.test(ln)){fp();fl();out.push("<blockquote>"+inline(ln.replace(/^>\s+/,""))+"</blockquote>");continue;}
    if(/^[-*]\s+/.test(ln)){fl();fp();list.push(ln.replace(/^[-*]\s+/,""));continue;}
    if(/^!\[/.test(ln)){fp();fl();out.push("<figure>"+inline(ln)+"</figure>");continue;}
    if(!ln.trim()){fp();fl();continue;}
    fl();para.push(ln.trim());
  }
  fp();fl();
  return out.join("");
}
function fmt(iso){
  var d=new Date(iso); if(isNaN(d.getTime())) return "";
  return d.getFullYear()+"-"+(d.getMonth()+1<10?"0":"")+(d.getMonth()+1)+"-"+(d.getDate()<10?"0":"")+d.getDate();
}
function api(path,opt){
  return fetch(path,opt||{}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){
      if(r.status===401){ showLogin(); throw new Error("未登录"); }
      if(!r.ok) throw new Error(j.error||("失败 "+r.status));
      return j;
    });
  });
}
function $(id){return document.getElementById(id);}

/* ---------- 登录 ---------- */
function showLogin(){ $("login").hidden=false; $("app").hidden=true; }
function showApp(){ $("login").hidden=true; $("app").hidden=false; }

$("doLogin").onclick=function(){
  var pw=$("pw").value.trim();
  if(!pw){ $("loginMsg").className="msg err"; $("loginMsg").textContent="请输入密码"; return; }
  api("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:pw})})
    .then(function(){ $("pw").value=""; $("loginMsg").textContent=""; showApp(); loadAll(); loadSettings(); })
    .catch(function(e){ $("loginMsg").className="msg err"; $("loginMsg").textContent=e.message==="未登录"?"密码不正确":e.message; });
};
$("pw").addEventListener("keydown",function(e){ if(e.key==="Enter") $("doLogin").click(); });

$("doLogout").onclick=function(){
  api("/api/login",{method:"DELETE"}).then(function(){ showLogin(); });
};

/* ---------- 标签页 ---------- */
var tabs=document.querySelectorAll(".tabs button");
for(var i=0;i<tabs.length;i++){
  tabs[i].onclick=function(){
    var t=this.getAttribute("data-tab");
    for(var j=0;j<tabs.length;j++) tabs[j].classList.toggle("on", tabs[j]===this);
    $("paneList").hidden = t!=="list";
    $("paneEdit").hidden = t!=="edit";
    $("paneSet").hidden = t!=="set";
  };
}

/* ---------- 列表 ---------- */
function loadAll(){
  api("/api/posts?all=1").then(function(j){
    ALL = j.posts||[];
    var rows = ALL.map(function(p){
      return '<tr><td class="t">'+esc(p.title)+'</td>'
        +'<td>'+fmt(p.created_at)+'</td>'
        +'<td><span class="st'+(p.status==="draft"?" draft":"")+'">'+(p.status==="draft"?"草稿":"已发布")+'</span></td>'
        +'<td class="acts"><a href="/#/post/'+p.id+'" target="_blank">看</a>'
        +'<button data-edit="'+p.id+'">改</button>'
        +'<button data-del="'+p.id+'" class="danger">删</button></td></tr>';
    }).join("");
    $("listInfo").textContent = "共 "+ALL.length+" 篇";
    $("listBox").innerHTML = ALL.length
      ? '<table class="plist"><colgroup><col style="width:48%"><col style="width:16%"><col style="width:12%"><col style="width:24%"></colgroup>'
        +'<thead><tr><th>标题</th><th>日期</th><th>状态</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'
      : '<p class="empty">还没有文章，点右上角「写新文章」开始。</p>';

    var eds=$("listBox").querySelectorAll("[data-edit]");
    for(var a=0;a<eds.length;a++) eds[a].onclick=function(){ openEditor(this.getAttribute("data-edit")); };
    var dels=$("listBox").querySelectorAll("[data-del]");
    for(var b=0;b<dels.length;b++) dels[b].onclick=function(){
      var id=this.getAttribute("data-del");
      if(!confirm("确定删除这篇文章？删了找不回来。")) return;
      api("/api/posts?id="+id,{method:"DELETE"}).then(function(){ loadAll(); });
    };
  }).catch(function(e){ $("listBox").innerHTML='<p class="empty">'+esc(e.message)+'</p>'; });
}

/* ---------- 编辑器 ---------- */
$("newPost").onclick=function(){
  CURRENT=null;
  $("fTitle").value=""; $("fDek").value=""; $("fCat").value=""; $("fBody").value="";
  $("fStatus").value="published"; $("editMsg").textContent="";
  switchTab("edit");
  $("fTitle").focus();
};
function switchTab(name){
  for(var j=0;j<tabs.length;j++) tabs[j].classList.toggle("on", tabs[j].getAttribute("data-tab")===name);
  $("paneList").hidden = name!=="list";
  $("paneEdit").hidden = name!=="edit";
  $("paneSet").hidden = name!=="set";
}
function openEditor(id){
  var p=null;
  for(var i=0;i<ALL.length;i++) if(String(ALL[i].id)===String(id)) p=ALL[i];
  if(!p) return;
  CURRENT=p.id;
  $("fTitle").value=p.title||""; $("fDek").value=p.dek||""; $("fCat").value=p.cat||"";
  $("fStatus").value=p.status||"published"; $("editMsg").textContent="";
  $("fBody").value="";
  api("/api/posts?id="+p.id).then(function(j){
    $("fBody").value=j.post.body||"";
  });
  switchTab("edit");
}

$("btnSave").onclick=function(){
  var title=$("fTitle").value.trim();
  if(!title){ $("editMsg").className="msg err"; $("editMsg").textContent="标题不能为空"; return; }
  var payload={
    title:title,
    dek:$("fDek").value.trim(),
    cat:$("fCat").value.trim()||"随笔",
    body:$("fBody").value,
    status:$("fStatus").value
  };
  $("editMsg").className="msg"; $("editMsg").textContent="保存中…";
  var p;
  if(CURRENT){
    payload.id=CURRENT;
    p = api("/api/posts",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(payload)});
  } else {
    p = api("/api/posts",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)});
  }
  p.then(function(){
    $("editMsg").className="msg ok"; $("editMsg").textContent="已保存";
    loadAll();
    setTimeout(function(){ switchTab("list"); },600);
  }).catch(function(e){
    $("editMsg").className="msg err"; $("editMsg").textContent=e.message;
  });
};
$("btnCancel").onclick=function(){ switchTab("list"); };

/* 插入格式标记 */
var ems=document.querySelectorAll("[data-em]");
for(var e2=0;e2<ems.length;e2++){
  ems[e2].onclick=function(){
    var ta=$("fBody"), mark=this.getAttribute("data-em");
    var pos=ta.selectionStart;
    var before=ta.value.slice(0,pos);
    if(before && !/\n$/.test(before)) before+="\n";
    ta.value = before + mark + ta.value.slice(pos);
    ta.focus();
    ta.selectionStart = ta.selectionEnd = (before+mark).length;
  };
}

/* 预览 */
$("btnPv").onclick=function(){
  var card=$("pvCard");
  card.hidden=!card.hidden;
  if(!card.hidden) $("pvBox").innerHTML=mdLite($("fBody").value);
};
$("fBody").addEventListener("input",function(){ if(!$("pvCard").hidden) $("pvBox").innerHTML=mdLite(this.value); });

/* 图片上传 */
$("btnImg").onclick=function(){ $("imgFile").click(); };
$("imgFile").onchange=function(){
  var f=this.files && this.files[0];
  if(!f) return;
  if(f.size>1.4*1024*1024){ alert("图片有点大（上限约 1.4MB），先用微信或截图工具压一下再传。"); this.value=""; return; }
  var rd=new FileReader();
  rd.onload=function(){
    var base=String(rd.result).split(",")[1] || "";
    api("/api/media",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({mime:f.type,data:base})})
      .then(function(j){
        var ta=$("fBody"), pos=ta.selectionStart;
        var md="![]("+j.url+")";
        var before=ta.value.slice(0,pos);
        if(before && !/\n$/.test(before)) before+="\n";
        ta.value = before + md + "\n" + ta.value.slice(pos);
        ta.focus();
      }).catch(function(e){ alert("上传失败："+e.message); });
  };
  rd.readAsDataURL(f);
  this.value="";
};

/* ---------- 设置 ---------- */
function loadSettings(){
  api("/api/settings").then(function(j){
    var s=j.settings||{};
    $("sName").value=s.site_name||""; $("sTag").value=s.tagline||"";
    $("sAbout").value=s.about||""; $("sFoot").value=s.footer_note||"";
  });
}
$("btnSet").onclick=function(){
  var payload={site_name:$("sName").value.trim(),tagline:$("sTag").value,about:$("sAbout").value,footer_note:$("sFoot").value};
  if(!payload.site_name) delete payload.site_name;
  var pw=$("sPass").value.trim();
  if(pw) payload.admin_password=pw;
  $("setMsg").className="msg"; $("setMsg").textContent="保存中…";
  api("/api/settings",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(payload)})
    .then(function(){ $("setMsg").className="msg ok"; $("setMsg").textContent="已保存"+(pw?"，下次用新密码登录":""); $("sPass").value=""; })
    .catch(function(e){ $("setMsg").className="msg err"; $("setMsg").textContent=e.message; });
};

/* ---------- 启动 ---------- */
api("/api/login").then(function(j){
  if(j.authed){ showApp(); loadAll(); loadSettings(); } else { showLogin(); }
}).catch(function(){ showLogin(); });
</script>
</body>
</html>
